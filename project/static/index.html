<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./images/css/reset.css">
    <link rel="stylesheet" href="./images/css/style.css">
    <title>SmartUploader</title>
</head>
<body>
    <section class="uploadIntro">
        <h2 class="uploadTitle">Upload Photos</h2>
        <p class="uploadDescription">Upload selfies, memes, or any fun pictures here.</p>
        <div>
            <div class="uploadIcon">
                <img src="./images/img/icon/feather_upload-cloud.png" alt="icon">
            </div>
            <p class="uploadDescription">Select a file</p>
            <p class="uploadDescription">Only support .jpg, .png and gif. <br>
                Maximum file size is 5MB</p>
        </div>
        <div>
            <div>
                <h2 class="uploadTitle">Current Upload</h2>
               <form action="/upload" method="POST" enctype="multipart/form-data" class="uploadLabel">
                    <input type="file" placeholder="input image" class="uploadInput">
                    <input type="submit" value="Upload" class="uploadCopy">
                </form>
            </div>
        </div>
    </section>
    <section id="file-list-wrapper">
    </section>
</body>
</html>
